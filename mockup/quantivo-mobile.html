<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantivo</title>
</head>
<body>
<div id="qm-app">
  <p class="vis-sr-only">Quantivo on a phone and a desktop. Sign in with a mobile number, confirm starting risk, activate Mani's, then read the sample feed and one signal.</p>
  <div class="pair">
    <section class="col">
      <p class="device-label">Phone</p>
      <article class="device device-phone" aria-label="Phone" data-device="phone">
        <div class="chrome" data-mode="gate">
          <header class="bar">
            <button type="button" class="menu-button" data-action="menu" aria-label="Open navigation" hidden>☰</button>
            <button type="button" class="back" data-action="back" hidden>Back</button>
            <div class="mark">Quantivo</div>
            <div class="tabs bar-tabs" data-bar-scanners hidden>
              <button type="button" data-action="scanner" data-scanner="mani" aria-pressed="true">Mani's Channel</button>
              <button type="button" data-action="scanner" data-scanner="other">Another scanner</button>
            </div>
          </header>
          <nav class="menu-sheet" aria-label="Sections" hidden>
            <button type="button" data-action="go" data-go="home">Home</button>
            <button type="button" data-action="go" data-go="scanners">Scanners</button>
            <button type="button" data-action="go" data-go="orders">Orders</button>
            <button type="button" data-action="go" data-go="admin">Admin</button>
            <button type="button" data-action="go" data-go="account">Account</button>
          </nav>
          <div class="stage" data-mount></div>
          <nav class="appnav" aria-label="Sections" hidden>
            <button type="button" data-action="go" data-go="home">Home</button>
            <button type="button" data-action="go" data-go="scanners">Scanners</button>
            <button type="button" data-action="go" data-go="orders">Orders</button>
            <button type="button" data-action="go" data-go="admin">Admin</button>
            <button type="button" data-action="go" data-go="account">Account</button>
          </nav>
        </div>
      </article>
    </section>
    <section class="col col-desk">
      <p class="device-label">Desktop</p>
      <article class="device device-desk" aria-label="Desktop" data-device="desk">
        <div class="chrome desk-chrome" data-mode="gate">
          <nav class="rail" aria-label="Sections" hidden>
            <div class="mark">Quantivo</div>
            <button type="button" data-action="go" data-go="home">Home</button>
            <button type="button" data-action="go" data-go="scanners">Scanners</button>
            <button type="button" data-action="go" data-go="orders">Orders</button>
            <button type="button" data-action="go" data-go="admin">Admin</button>
            <button type="button" data-action="go" data-go="account">Account</button>
          </nav>
          <div class="desk-main">
            <header class="bar">
              <button type="button" class="back" data-action="back" hidden>Back</button>
              <div class="mark desk-mark">Quantivo</div>
            </header>
            <div class="stage" data-mount></div>
          </div>
        </div>
      </article>
    </section>
  </div>
  <template id="qm-screens">
    <section data-screen="number">
      <h2>Sign in</h2>
      <p class="lead">Use your Indian mobile number. A one-time code opens the session.</p>
      <p class="fine" data-signed-out hidden>You are signed out.</p>
      <label class="field">Mobile number
        <span class="phone-row"><span class="cc">+91</span><input data-mobile inputmode="numeric" autocomplete="tel" value="9845011220"></span>
      </label>
      <p class="error" data-error="number" hidden></p>
      <button type="button" class="primary" data-action="request-code">Send code</button>
    </section>
    <section data-screen="code" hidden>
      <h2>Enter the code</h2>
      <p class="lead">Sent to <span data-sent-to></span>.</p>
      <p class="dev">Development shows this code because SMS is not connected: <strong>482913</strong>. Production does not display it.</p>
      <label class="field">One-time code
        <input data-otp inputmode="numeric" autocomplete="one-time-code" value="">
      </label>
      <p class="error" data-error="code" hidden></p>
      <button type="button" class="primary" data-action="verify">Continue</button>
      <button type="button" class="ghost" data-action="change-number">Change number</button>
    </section>
    <section data-screen="start" hidden>
      <p class="step">Step 1 of 2</p>
      <h2>Starting risk</h2>
      <p class="lead">A new account starts with these preferences. They are not a recommendation. Change any of them now. You can change them again from Account, and the change is audited.</p>
      <label class="field">Display name
        <input data-name maxlength="40" placeholder="Optional">
      </label>
      <div class="risk-edit">
        <label class="field">Capital set aside (₹)
          <input data-risk="capital" inputmode="decimal" value="50000">
        </label>
        <label class="field">Maximum loss per trade (₹)
          <input data-risk="maxRisk" inputmode="decimal" value="500">
        </label>
        <label class="field">Quantity cap
          <input data-risk="maxQty" inputmode="numeric" value="500">
        </label>
        <label class="field">Exposure cap (₹)
          <input data-risk="exposure" inputmode="decimal" value="200000">
        </label>
        <p class="meta">Products allowed</p>
        <div class="allow">
          <label class="check"><input type="checkbox" data-allow="MIS" checked> MIS</label>
          <label class="check"><input type="checkbox" data-allow="CNC" checked> CNC</label>
        </div>
      </div>
      <p class="error" data-error="risk" hidden></p>
      <p class="fine">Capital set aside is not the amount at risk. Quantity uses the maximum loss, and that loss cannot exceed the capital set aside.</p>
      <button type="button" class="primary" data-action="to-activate">Continue</button>
    </section>
    <section data-screen="activate" hidden>
      <p class="step">Step 2 of 2</p>
      <h2>Add a scanner</h2>
      <p class="lead">Signals stay hidden until this scanner is activated. Ratings and subscriber counts are not shown.</p>
      <article class="offer">
        <div class="offer-top">
          <span class="mono" aria-hidden="true">M</span>
          <div>
            <h3>Mani's Channel</h3>
            <p>Mani's</p>
          </div>
        </div>
        <p>Separate Telegram channels for Equity, F&amp;O, and commodity. Horizon words stay inside the channel that wrote them.</p>
        <p class="meta">Equity says “Intraday to 7 days”. F&amp;O says “Intraday”. Those are not the same filter.</p>
        <p class="price">₹999 monthly</p>
        <p class="fine">This sample account is registered for Equity and Commodity. F&amp;O is not registered. Activating does not charge you.</p>
        <p class="fine">Mani's is the first scanner. These calls are sample data until the Telegram channel is connected. They are not market recommendations.</p>
      </article>
      <button type="button" class="primary" data-action="activate">Activate scanner</button>
    </section>
    <section data-screen="home" hidden>
      <div class="tabs" role="tablist" aria-label="Scanner">
        <button type="button" data-action="scanner" data-scanner="mani" aria-pressed="true">Mani's Channel</button>
        <button type="button" data-action="scanner" data-scanner="other">Another scanner</button>
      </div>
      <div class="feed-head">
        <span class="mono" aria-hidden="true" data-home-mark data-home-heading>M</span>
        <div>
          <h2 data-home-title data-home-heading>Mani's Channel</h2>
          <p class="meta" data-home-meta>Mani's · Equity, F&amp;O, and Commodity channels · Last publication 2 min ago</p>
          <p class="meta" data-broker-line></p>
        </div>
      </div>
      <p class="fine" data-other-empty hidden>No channels yet. One tap above returns to a scanner you already hold.</p>
      <div class="tabs" role="tablist" aria-label="Channel" data-mani-channels>
        <button type="button" data-action="channel" data-channel="all" aria-pressed="true">All registered</button>
        <button type="button" data-action="channel" data-channel="equity">Equity</button>
        <button type="button" data-action="channel" data-channel="fno">F&amp;O</button>
        <button type="button" data-action="channel" data-channel="commodity">Commodity</button>
      </div>
      <div data-feed>
        <p class="fine" data-channel-note hidden></p>
        <div class="viewbar" role="group" aria-label="Which calls">
          <button type="button" data-action="call-view" data-view="actionable" aria-pressed="true">Actionable</button>
          <button type="button" data-action="call-view" data-view="all" aria-pressed="false">All</button>
        </div>
        <div data-list></div>
      </div>
      <div data-locked hidden>
        <p class="warn" data-locked-copy></p>
        <button type="button" class="primary" data-action="register-channel">Register for this channel</button>
      </div>
      <p class="fine">While this list is open, stored calls are read again every 5 seconds. The last traded price comes from one Fyers data socket on the server. A symbol with no recent tick reuses a quote for up to a minute. On a weekday from 09:15 to 15:30 IST a new Telegram post is stored about every 5 seconds. A buy missing its stop or target is completed from the next Telegram message when that message follows within 10 minutes.</p>
      <p class="fine">Last LTP is the last traded price from Fyers for an NSE cash symbol. During the cash session the same line says LTP. The price is green when it is above the previous close and red when it is below, with that percent beside it. These review figures are samples. The price is not the trigger and does not change quantity. A stop or a target on the wrong side of the buy moves by a power of ten when the current price shows a missing zero or a slipped decimal. The row shows the trigger, the stop, and the targets. The final target is Last. T2 is shown only when a price sits between the first target and the last. The candlestick icon opens the session candles at 1 minute and 5 minutes. A finished minute is saved, and that day is not requested again. The minute still forming comes from the live price. Entry, Caution, Not valid, T1 trail, T2 trail, Final, and Stop are the price marks. The time on the chip is the minute of the one-minute bar. These review times are samples. A call that has touched the first target or the stop leaves Actionable, including Caution and a trail. A last price already through the first target or the stop leaves Actionable as well. That call is not an entry until a fresh call. Not valid, Final, and Stop leave too.</p>
      <p class="fine">A signal is not an order. Nothing is sent unless you confirm it, and this build does not send orders.</p>
    </section>
    <section data-screen="detail" hidden>
      <div data-detail></div>
    </section>
    <section data-screen="chart" hidden>
      <div data-chart></div>
    </section>
    <section data-screen="scanners" hidden>
      <h2>Scanners</h2>
      <p class="lead">Provider, scanner, category, and price. No rating and no subscriber count.</p>
      <article class="offer">
        <div class="offer-top">
          <span class="mono" aria-hidden="true">M</span>
          <div>
            <h3>Mani's Channel</h3>
            <p>Mani's</p>
          </div>
          <button type="button" class="ghost" style="margin-left:auto">Manage</button>
        </div>
        <p class="fine">Manage opens Admin. One card holds the provider name, the scanner name, and that scanner's channels.</p>
        <p>Register a channel to see its calls. Each channel keeps its own horizon words.</p>
        <p class="meta">Equity · Intraday to 7 days, Short term, Long term. F&amp;O · Intraday. Commodity · Positional.</p>
        <p class="price">₹999 monthly</p>
        <div data-channels></div>
      </article>
      <button type="button" class="primary" data-action="open-feed">Open feed</button>
    </section>
    <section data-screen="orders" hidden>
      <h2>Orders</h2>
      <p class="fine">Saved orders for this account. Zerodha is not sent an order. The stop and targets stay inactive.</p>
      <div data-orders></div>
    </section>
    <section data-screen="account" hidden>
      <h2>Account</h2>
      <label class="field">Display name
        <input data-name maxlength="40" placeholder="Optional">
      </label>
      <dl class="facts">
        <div><dt>Mobile</dt><dd data-account-mobile></dd></div>
      </dl>
      <h3>Risk profile</h3>
      <div class="risk-edit">
        <label class="field">Capital set aside (₹)
          <input data-risk="capital" inputmode="decimal" value="50000">
        </label>
        <label class="field">Maximum loss per trade (₹)
          <input data-risk="maxRisk" inputmode="decimal" value="500">
        </label>
        <label class="field">Quantity cap
          <input data-risk="maxQty" inputmode="numeric" value="500">
        </label>
        <label class="field">Exposure cap (₹)
          <input data-risk="exposure" inputmode="decimal" value="200000">
        </label>
        <p class="meta">Products allowed</p>
        <div class="allow">
          <label class="check"><input type="checkbox" data-allow="MIS" checked> MIS</label>
          <label class="check"><input type="checkbox" data-allow="CNC" checked> CNC</label>
        </div>
      </div>
      <p class="error" data-error="risk" hidden></p>
      <p class="fine">Capital set aside is not the amount at risk. Quantity uses the maximum loss, and that loss cannot exceed the capital set aside.</p>
      <h3>Zerodha</h3>
      <p>Not signed in.</p>
      <p class="fine">Sign in on Zerodha. The session lasts until 6:00 AM IST and is not refreshed. Sign in again after that. This build does not send an order.</p>
      <button type="button" class="primary" data-action="broker">Sign in on Zerodha</button>
      <button type="button" class="ghost" data-action="logout">Log out</button>
    </section>
    <section data-screen="admin" hidden>
      <h2>Admin configuration</h2>
      <p class="lead">Each channel has its own feed. One Telegram login on the worker is shared by every Telegram channel. The phone and session are not entered here.</p>
      <h3>Global</h3>
      <article class="offer">
        <h3>Telegram login</h3>
        <p>Not set on this worker.</p>
        <p class="fine">Every Telegram channel uses this one login. Saving a channel id does not join the channel.</p>
      </article>
      <article class="offer">
        <h3>How long a call stays actionable</h3>
        <p class="fine">Intraday and BTST use minutes. Short term and long term use days. At 30 days those two match expiry, so the chip says Expired. A shorter number marks the call Stale sooner. Intraday to 7 days expires 7 days after the post.</p>
        <label class="field">Intraday and BTST, minutes
          <input value="30" inputmode="numeric">
        </label>
        <label class="field">Short term, days
          <input value="30" inputmode="numeric">
        </label>
        <label class="field">Long term, days
          <input value="30" inputmode="numeric">
        </label>
        <button type="button" class="primary">Save clocks</button>
      </article>
      <article class="offer">
        <h3>Fyers quotes</h3>
        <p>Connected until 8 Nov 2026.</p>
        <p class="fine">Save the Fyers app id, app secret, PIN, client id, and TOTP key once. An update shows the saved app id and client id. The app secret, PIN, and TOTP key stay on the server, and a blank field keeps the saved value. Quantivo does not ask for the Fyers password. The access token ends at 6:30 AM IST. The server signs in again with the TOTP key after that.</p>
      </article>
      <article class="offer">
        <h3>Zerodha trading</h3>
        <p>Kite app saved.</p>
        <p class="fine">Save the Kite Connect api key and api secret once, and register the callback URL on that app. A trader signs in on Zerodha from Account. The session lasts until 6:00 AM IST. Zerodha does not refresh it. This build does not send an order.</p>
      </article>
      <h3>Saved orders</h3>
      <article class="offer">
        <p class="fine">These are proposed orders that were not sent to Zerodha. Deleting one asks first, removes that saved intent, and leaves the call in place. An order that was sent stays in the list.</p>
        <p>No saved orders.</p>
      </article>
      <h3>Catalogue</h3>
      <article class="offer">
        <h3>Add a scanner</h3>
        <label class="field">Provider
          <input placeholder="Provider name">
        </label>
        <label class="field">Scanner
          <input placeholder="Scanner name">
        </label>
        <label class="field">Description
          <input placeholder="Shown under the scanner name">
        </label>
        <p class="fine">A new scanner starts with no channels and no price. The same provider name adds another scanner under that provider.</p>
        <button type="button" class="primary">Add scanner</button>
      </article>
      <article class="offer">
        <h3>Mani's · Mani's Channel</h3>
        <p class="fine">The provider is shared by every scanner from that publisher. The scanner name is what traders open. Channels belong on this card.</p>
        <label class="field">Provider name
          <input value="Mani's">
        </label>
        <label class="field">Scanner name
          <input value="Mani's Channel">
        </label>
        <label class="field">Description
          <input value="Mani's equity channel. Development sample calls stand in until Telegram is connected.">
        </label>
        <button type="button" class="primary">Save scanner</button>
        <button type="button" class="ghost">Delete scanner</button>
        <h3>Channels</h3>
        <label class="field">Channel name
          <input placeholder="F&amp;O">
        </label>
        <div class="segments" role="group" aria-label="New channel segment">
          <button type="button">Equity</button>
          <button type="button">F&amp;O</button>
          <button type="button">Commodity</button>
        </div>
        <p class="fine">A new channel starts as sample, and traders register for it separately.</p>
        <button type="button" class="primary">Add channel</button>
      </article>
      <article class="offer">
        <h3>Equity</h3>
        <p class="meta">On Mani's Channel · sample until a feed is saved</p>
        <label class="field">Channel name
          <input value="Equity">
        </label>
        <p class="fine">This is the name on the scanner card and on Home. Save channel stores it.</p>
        <p class="meta">Feed</p>
        <div class="segments" role="group" aria-label="Equity feed">
          <button type="button" data-action="admin-kind" data-admin-kind="none">Sample</button>
          <button type="button" data-action="admin-kind" data-admin-kind="telegram">Telegram</button>
          <button type="button" data-action="admin-kind" data-admin-kind="http">HTTP</button>
        </div>
        <div data-admin-fields hidden>
          <label class="field">Telegram channel
            <input data-admin-channel placeholder="Equity Premium SEBI Reg">
          </label>
          <p class="fine">Find channel looks up the id from the chats this worker's login has already joined. The id is what gets saved.</p>
        </div>
        <p class="fine" data-admin-notice hidden></p>
        <p class="warn" data-admin-warn hidden></p>
        <div data-admin-warn-actions hidden>
          <button type="button" class="primary" data-action="admin-warn-confirm">Delete Equity</button>
          <button type="button" class="ghost" data-action="admin-warn-keep">Keep this channel</button>
        </div>
        <button type="button" class="primary" data-action="admin-save">Save channel</button>
        <button type="button" class="ghost" data-action="admin-delete">Delete channel</button>
      </article>
    </section>
  </template>
</div>

    });
    root.querySelectorAll("[data-error]").forEach(function (node) {
      var message = state.errors[node.getAttribute("data-error")] || "";
      node.hidden = !message;
      node.textContent = message;
    });
    root.querySelectorAll("[data-list]").forEach(paintList);
    root.querySelectorAll("[data-detail]").forEach(paintDetail);
    root.querySelectorAll("[data-chart]").forEach(paintChart);
    var otherScanner = state.scanner === "other";
    var locked = !otherScanner && state.channel !== "all" && !channelOpen(state.channel);
    root.querySelectorAll("[data-feed]").forEach(function (node) { node.hidden = otherScanner || locked; });
    root.querySelectorAll("[data-locked]").forEach(function (node) { node.hidden = !locked; });
    root.querySelectorAll("[data-locked-copy]").forEach(function (node) {
      node.textContent = "You are not registered for the " + channelLabel(state.channel) + " channel. Mani's sends it on its own Telegram channel, so these calls stay hidden.";
    });
    var missing = channels.filter(function (item) { return !channelOpen(item.key); });
    root.querySelectorAll("[data-channel-note]").forEach(function (node) {
      node.hidden = locked || state.channel !== "all" || !missing.length;
      node.textContent = missing.length ? "Not registered for " + missing.map(function (item) { return item.label; }).join(", ") + ". That channel is not shown." : "";
    });
    var onHome = state.screen === "home";
    root.querySelectorAll(".device-phone .bar .mark").forEach(function (node) { node.hidden = onHome; });
    root.querySelectorAll(".device-phone [data-bar-scanners]").forEach(function (node) { node.hidden = !onHome; });
    root.querySelectorAll("[data-action='scanner']").forEach(function (button) {
      button.setAttribute("aria-pressed", button.getAttribute("data-scanner") === state.scanner ? "true" : "false");
    });
    root.querySelectorAll("[data-home-title]").forEach(function (node) {
      node.textContent = otherScanner ? "Another scanner" : "Mani's Channel";
    });
    root.querySelectorAll("[data-home-mark]").forEach(function (node) {
      node.textContent = otherScanner ? "A" : "M";
    });
    root.querySelectorAll("[data-home-meta]").forEach(function (node) {
      node.textContent = otherScanner
        ? "Review only. This scanner has no channels and no calls."
        : "Mani's · Equity, F&O, and Commodity channels · Last publication 2 min ago";
    });
    root.querySelectorAll("[data-mani-channels]").forEach(function (node) {
      node.hidden = otherScanner;
    });
    root.querySelectorAll("[data-other-empty]").forEach(function (node) {
      node.hidden = !otherScanner;
    });
    root.querySelectorAll("[data-action='channel']").forEach(function (button) {
      button.setAttribute("aria-pressed", button.getAttribute("data-channel") === state.channel ? "true" : "false");
    });
    root.querySelectorAll("[data-channels]").forEach(function (host) {
      host.replaceChildren();
      channels.forEach(function (item) {
        var row = el("div", "channel");
        var open = channelOpen(item.key);
        var words = [];
        var seenWords = {};
        signals.forEach(function (signal) {
          if (signal.channel !== item.key || seenWords[signal.horizon]) return;
          seenWords[signal.horizon] = true;
          words.push(signal.horizon);
        });
        row.appendChild(el("strong", "", item.label));
        row.appendChild(el("span", open ? "" : "meta", open ? "Registered" : "Not registered"));
        row.appendChild(el("span", "words", "Horizons · " + words.join(", ")));
        var toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "ghost";
        toggle.setAttribute("data-action", "toggle-channel");
        toggle.setAttribute("data-channel", item.key);
        toggle.textContent = open ? "Remove registration" : "Register";
        row.appendChild(toggle);
        host.appendChild(row);
      });
    });
    var closed = signals.filter(function (signal) {
      if (!channelOpen(signal.channel)) return false;
      if (state.channel !== "all" && signal.channel !== state.channel) return false;
      return derived(signal) !== "active" || priceClosed(signal);
    }).length;
    var actionable = signals.filter(function (signal) {
      if (!channelOpen(signal.channel)) return false;
      if (state.channel !== "all" && signal.channel !== state.channel) return false;
      return derived(signal) === "active" && !priceClosed(signal);
    }).length;
    root.querySelectorAll("[data-action='call-view']").forEach(function (button) {
      var allSide = button.getAttribute("data-view") === "all";
      var selected = allSide === state.includeClosed;
      button.setAttribute("aria-pressed", selected ? "true" : "false");
      if (allSide) button.textContent = closed === 0 ? "All" : "All · " + closed;
      else button.textContent = "Actionable · " + actionable;
    });
    root.querySelectorAll("[data-broker-line]").forEach(function (node) {
      node.textContent = state.broker === "connected" ? "Zerodha connected" : "Zerodha sign-in needed";
    });
    root.querySelectorAll("[data-account-mobile]").forEach(function (node) {
      node.textContent = "+91 " + state.mobile;
    });
    root.querySelectorAll("[data-admin-kind]").forEach(function (button) {
      button.setAttribute("aria-pressed", button.getAttribute("data-admin-kind") === state.adminKind ? "true" : "false");
    });
    root.querySelectorAll("[data-admin-channel]").forEach(function (input) {
      if (input !== document.activeElement) input.value = state.adminChannel;
    });
    root.querySelectorAll("[data-admin-fields]").forEach(function (node) {
      node.hidden = state.adminKind !== "telegram";
    });
    root.querySelectorAll("[data-admin-notice]").forEach(function (node) {
      node.hidden = !state.adminNotice;
      node.textContent = state.adminNotice;
    });
    root.querySelectorAll("[data-admin-warn]").forEach(function (node) {
      node.hidden = !state.adminWarn;
      node.textContent = state.adminWarn;
    });
    root.querySelectorAll("[data-admin-warn-actions]").forEach(function (node) {
      node.hidden = !state.adminWarn;
    });
    root.querySelectorAll("[data-entitlement-line]").forEach(function (node) {
      node.textContent = state.entitled ? "Entitlement active." : "Not activated.";
    });
  }

  root.addEventListener("input", function (event) {
    var input = event.target;
    if (input.matches("[data-mobile]")) state.mobile = input.value.replace(/\D/g, "").slice(0, 10);
    if (input.matches("[data-name]")) state.name = input.value;
    if (input.matches("[data-otp]")) state.otpDraft = input.value;
    if (input.matches("[data-admin-channel]")) state.adminChannel = input.value.trim();
    if (input.matches("[data-quantity]")) {
      state.quantityEdited = true;
      state.quantity = input.value.replace(/\D/g, "");
      state.confirmed = "";
      paint();
    }
    if (input.matches("[data-draft]") && state.draft) {
      var draftFieldName = input.getAttribute("data-draft");
      if (draftFieldName === "target") state.draft.targets[Number(input.getAttribute("data-index"))][1] = input.value;
      else state.draft[draftFieldName] = input.value;
      state.confirmed = "";
      paint();
    }
    if (input.matches("[data-risk]")) {
      var key = input.getAttribute("data-risk");
      state.risk[key] = key === "maxQty" ? input.value.replace(/\D/g, "") : input.value.replace(/[^\d.]/g, "");
      state.errors.risk = parsedRisk().error;
      paint();
    }
    if (input.matches("[data-allow]")) {
      state.risk[input.getAttribute("data-allow") === "MIS" ? "mis" : "cnc"] = input.checked;
      state.errors.risk = parsedRisk().error;
      paint();
    }
  });

  root.addEventListener("click", function (event) {
    var button = event.target.closest("[data-action]");
    if (!button || !root.contains(button)) return;
    var action = button.getAttribute("data-action");
    if (action === "request-code") {
      state.mobile = state.mobile.replace(/\D/g, "");
      if (!/^[6-9]\d{9}$/.test(state.mobile)) {
        setError("number", "Enter a valid Indian mobile number.");
      } else {
        setError("number", "");
        state.signedOut = false;
        state.screen = "code";
      }
    } else if (action === "change-number") {
      setError("code", "");
      state.screen = "number";
    } else if (action === "verify") {
      var codes = [];
      root.querySelectorAll("[data-otp]").forEach(function (input) {
        if (input.value) codes.push(input.value.trim());
      });
      var code = codes[0] || "";
      if (code !== "482913") {
        setError("code", "That code does not match.");
      } else {
        setError("code", "");
        state.screen = state.known ? "home" : "start";
        state.known = true;
      }
    } else if (action === "to-activate") {
      var profile = parsedRisk();
      state.errors.risk = profile.error;
      if (profile.ok) state.screen = "activate";
    } else if (action === "activate") {
      state.entitled = true;
      state.screen = "home";
    } else if (action === "scanner") {
      state.scanner = button.getAttribute("data-scanner");
      state.channel = "all";
    } else if (action === "channel") {
      state.channel = button.getAttribute("data-channel");
    } else if (action === "register-channel") {
      if (state.channel !== "all") state.registered[state.channel] = true;
    } else if (action === "toggle-channel") {
      var channelKey = button.getAttribute("data-channel");
      state.registered[channelKey] = !state.registered[channelKey];
      if (!state.registered[channelKey] && state.channel === channelKey) state.channel = "all";
    } else if (action === "call-view") {
      state.includeClosed = button.getAttribute("data-view") === "all";
    } else if (action === "delete-order") {
      state.confirmed = "";
      state.draft = null;
    } else if (action === "open-signal") {
      state.selected = button.getAttribute("data-symbol");
      state.product = "MIS";
      state.confirmed = "";
      state.ticket = "";
      state.editing = false;
      state.draft = null;
      state.screen = "detail";
    } else if (action === "open-chart") {
      state.selected = button.getAttribute("data-symbol");
      state.chartFrom = state.screen;
      state.screen = "chart";
    } else if (action === "chart-interval") {
      state.chartInterval = button.getAttribute("data-interval");
    } else if (action === "set-product") {
      state.product = button.getAttribute("data-product");
      state.confirmed = "";
    } else if (action === "set-side") {
      var chosen = findSignal(state.selected);
      state.ticket = button.getAttribute("data-side");
      state.editing = false;
      state.quantityEdited = false;
      state.quantity = "";
      state.confirmed = "";
      state.draft = {
        trigger: String(chosen.trigger),
        stop: String(chosen.stop),
        targets: chosen.targets.map(function (target) { return [target[0], String(target[1])]; })
      };
    } else if (action === "toggle-edit") {
      state.editing = !state.editing;
    } else if (action === "confirm") {
      state.confirmed = state.selected;
    } else if (action === "back") {
      if (state.screen === "chart") state.screen = state.chartFrom || "home";
      else if (state.screen === "detail") state.screen = "home";
      else if (state.screen === "activate") state.screen = "start";
      else if (state.screen === "code") state.screen = "number";
    } else if (action === "menu") {
      state.menuOpen = !state.menuOpen;
    } else if (action === "go") {
      state.menuOpen = false;
      var next = button.getAttribute("data-go");
      if (next === "home" && !state.entitled) next = "activate";
      state.screen = next;
    } else if (action === "open-feed") {
      state.screen = state.entitled ? "home" : "activate";
    } else if (action === "broker") {
      state.broker = state.broker === "connected" ? "disconnected" : "connected";
    } else if (action === "admin-kind") {
      state.adminKind = button.getAttribute("data-admin-kind");
      state.adminNotice = "";
    } else if (action === "admin-delete") {
      state.adminNotice = "";
      state.adminWarn = "Delete Equity? This removes the channel and its stored calls. Traders will no longer see it. This cannot be undone.";
    } else if (action === "admin-warn-keep") {
      state.adminWarn = "";
    } else if (action === "admin-warn-confirm") {
      state.adminWarn = "";
      state.adminNotice = "Equity was not removed in this review. The phone would delete it only after this warning.";
    } else if (action === "admin-save") {
      if (state.adminKind === "telegram" && state.adminChannel.length < 3) {
        state.adminNotice = "Enter the Telegram channel name.";
      } else if (state.adminKind === "telegram") {
        state.adminNotice = "Equity is saved. The channel id was taken from the joined chat.";
      } else if (state.adminKind === "none") {
        state.adminNotice = "Equity stays on the sample.";
      } else if (state.adminKind === "http") {
        state.adminNotice = "The HTTP settings are saved. The worker reads a PDL Sweep URL. Today's calls stay on Actionable through that date. Earlier calls are on All.";
      } else {
        state.adminNotice = "Equity is saved. The shared Telegram login is still set on the worker.";
      }
    } else if (action === "logout") {
      state.screen = "number";
      state.signedOut = true;
      state.confirmed = "";
      root.querySelectorAll("[data-otp]").forEach(function (input) { input.value = ""; });
    }
    paint();
  });

  paint();
})();
</script>

</body>
</html>
