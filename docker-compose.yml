services:
  postgres:
    image: postgres:16-alpine
    container_name: quantivo-postgres
    environment:
      POSTGRES_USER: quantivo
      POSTGRES_PASSWORD: quantivo
      POSTGRES_DB: quantivo
    ports:
      - "5433:5432"
    volumes:
      - quantivo-pg:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantivo -d quantivo"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  quantivo-pg:
